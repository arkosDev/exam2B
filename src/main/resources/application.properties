server.port=8080
#jdbc driver class name
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://192.168.100.28:3306/2bexam
spring.datasource.username=salamandra
spring.datasource.password=dummy00


spring.jpa.properties.dialect.hibernate=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#Hibernate
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
logging.level.org.springframework=INFO 
logging.level.com.iarcos.b2=trace

#Hibernate
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Configuración del patrón de log para la consola
logging.pattern.console=%d{yyMMdd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Configuración del patrón de log para archivos
logging.pattern.file=%d{yyMMdd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

springdoc.swagger-ui.path=/exam-documentation
springdoc.api-docs.path=/exam-api-docs

springdoc.packages-to-scan=com.iarcos.b2
springdoc.swagger-ui.tryItOutEnabled=false
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.filter=true
